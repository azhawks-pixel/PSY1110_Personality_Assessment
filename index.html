<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explore Your Personality | PSY1110</title>
<style>
:root{--ink:#172733;--muted:#536774;--bg:#f3f7f5;--paper:#fff;--line:#d7e2df;--teal:#15645e;--wash:#e6f2ee;--gold:#dbb563}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 64px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.brand{font-weight:800;letter-spacing:.07em;color:var(--teal);font-size:.82rem}.step{color:var(--muted);font-size:.9rem}.paper{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,44px);box-shadow:0 12px 36px #15382d0b}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;font-weight:800;color:var(--teal)}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.12;margin:.3em 0}h2{font-size:1.65rem;line-height:1.25;margin:.3em 0}h3{margin:0 0 6px}p{margin:14px 0}small,.muted{color:var(--muted)}.callout{background:var(--wash);border-radius:14px;padding:16px 18px;margin:22px 0}.progress{height:8px;background:#e5eeeb;border-radius:8px;overflow:hidden;margin:20px 0 30px}.progress>div{height:100%;background:var(--teal);transition:width .2s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}button{font:inherit;cursor:pointer;border-radius:12px;min-height:48px;padding:11px 18px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:700}button.secondary{background:#fff;color:var(--teal)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.question{padding:18px 0;border-top:1px solid var(--line)}fieldset{border:0;margin:0;padding:0;min-width:0}legend{font-size:1.08rem;font-weight:700;padding:0 0 12px}.number{color:var(--teal);font-weight:800;margin-right:8px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.choices label{cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.77rem;line-height:1.2;padding:10px 4px;border:1px solid var(--line);border-radius:10px}.choices label:has(input:checked){background:var(--wash);border-color:var(--teal);font-weight:700}.choices label:focus-within{outline:3px solid var(--gold);outline-offset:2px}.choices input{accent-color:var(--teal);width:18px;height:18px;margin:0}.error{color:#9e2d29;font-weight:700}.result{padding:18px 0;border-top:1px solid var(--line)}.result-head{display:flex;justify-content:space-between;gap:10px}.track{height:12px;background:#e5eeeb;border-radius:9px;overflow:hidden;margin:10px 0}.fill{height:100%;background:var(--teal)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare>div{border:1px solid var(--line);border-radius:12px;padding:14px}footer{font-size:.8rem;color:var(--muted);padding:20px 8px}a{color:#075b65}@media(max-width:550px){.choices{grid-template-columns:1fr}.choices label{flex-direction:row;text-align:left;padding:10px 12px;font-size:.92rem}.compare{grid-template-columns:1fr}}@media print{body{background:#fff}main{max-width:none}.paper{box-shadow:none;border:0}.head,footer,.actions,.progress{display:none}}
</style></head><body><main><div class="head"><span class="brand">PSY1110 · PERSONALITY LAB</span><span class="step" id="step" aria-live="polite"></span></div><div class="paper"><div class="progress" id="progress" role="progressbar" aria-label="Inventory progress" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"><div id="bar"></div></div><div id="view"></div></div><footer>Educational activity · Responses stay in this browser tab and are not sent to a server.</footer></main>
<script>
(()=>{'use strict';
// The 50-item IPIP representation of Goldberg's (1992) Big-Five factor markers.
// Scale order E, A, C, Emotional Stability, Intellect/Imagination; + or - scoring key.
const rows=[
['Am the life of the party.',0,1],['Feel little concern for others.',1,-1],['Am always prepared.',2,1],['Get stressed out easily.',3,-1],['Have a rich vocabulary.',4,1],
["Don't talk a lot.",0,-1],['Am interested in people.',1,1],['Leave my belongings around.',2,-1],['Am relaxed most of the time.',3,1],['Have difficulty understanding abstract ideas.',4,-1],
['Feel comfortable around people.',0,1],['Insult people.',1,-1],['Pay attention to details.',2,1],['Worry about things.',3,-1],['Have a vivid imagination.',4,1],
['Keep in the background.',0,-1],["Sympathize with others' feelings.",1,1],['Make a mess of things.',2,-1],['Seldom feel blue.',3,1],['Am not interested in abstract ideas.',4,-1],
['Start conversations.',0,1],["Am not interested in other people's problems.",1,-1],['Get chores done right away.',2,1],['Am easily disturbed.',3,-1],['Have excellent ideas.',4,1],
['Have little to say.',0,-1],['Have a soft heart.',1,1],['Often forget to put things back in their proper place.',2,-1],['Get upset easily.',3,-1],['Do not have a good imagination.',4,-1],
['Talk to a lot of different people at parties.',0,1],['Am not really interested in others.',1,-1],['Like order.',2,1],['Change my mood a lot.',3,-1],['Am quick to understand things.',4,1],
["Don't like to draw attention to myself.",0,-1],['Take time out for others.',1,1],['Shirk my duties.',2,-1],['Have frequent mood swings.',3,-1],['Use difficult words.',4,1],
["Don't mind being the center of attention.",0,1],["Feel others' emotions.",1,1],['Follow a schedule.',2,1],['Get irritated easily.',3,-1],['Spend time reflecting on things.',4,1],
['Am quiet around strangers.',0,-1],['Make people feel at ease.',1,1],['Am exacting in my work.',2,1],['Often feel blue.',3,-1],['Am full of ideas.',4,1]
];
const names=['Extraversion','Agreeableness','Conscientiousness','Emotional stability','Intellect / imagination'];
const descriptions=[
  ['This scale reflects social energy and comfort with interaction.','At one end, people may prefer quieter settings and fewer conversations.','At the other, people may seek interaction and feel comfortable initiating it.'],
  ['This scale reflects concern for others and a cooperative approach.','At one end, people may respond more independently or bluntly.','At the other, people may readily attend to others’ feelings and needs.'],
  ['This scale reflects organization, preparation, and follow-through.','At one end, people may prefer a flexible or spontaneous approach.','At the other, people may favor plans, routines, and careful completion.'],
  ['This scale reflects a tendency to feel calm rather than easily distressed.','At one end, people may report more worry, stress, or emotional shifts.','At the other, people may report feeling calm more often.'],
  ['This scale reflects interest in ideas, imagination, and reflection.','At one end, people may prefer familiar or concrete ideas.','At the other, people may enjoy abstract ideas, imagination, and reflection.']
];
const options=['Very inaccurate','Moderately inaccurate','Neither accurate nor inaccurate','Moderately accurate','Very accurate'];
const answers=Array(50).fill(null);let page=-1;const view=document.getElementById('view'),step=document.getElementById('step'),bar=document.getElementById('bar');
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function button(label,fn,secondary=false){const b=element('button',secondary?'secondary':'',label);b.type='button';b.addEventListener('click',fn);return b}
function header(label,progress){step.textContent=label;bar.style.width=progress+'%';document.getElementById('progress').setAttribute('aria-valuenow',String(progress/2));view.replaceChildren()}function focusHeading(){requestAnimationFrame(()=>{const h=view.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:'instant'})})}
function intro(){page=-1;header('Introduction',0);view.innerHTML='<div class="eyebrow">A classroom exploration</div><h1>Explore your personality</h1><p>Personality can be described in more than one way. In this activity, you will rate 50 short statements and see your pattern across five broad traits.</p><div class="callout"><strong>For learning, not diagnosis.</strong> These are self-reported traits, not fixed labels or a clinical assessment. Your results stay in this browser tab. No names or answers are sent to us.</div><p>Answer as you generally see yourself now. There are no right answers. Allow about 8–12 minutes.</p><p><small>Based on the public-domain 50-item IPIP representation of Goldberg’s Big Five factor markers.</small></p>';view.append(button('Begin the inventory',()=>show(0)))}
function show(p){page=p;header('Statements '+(p*10+1)+'–'+(p*10+10)+' of 50',p*20);view.append(element('div','eyebrow','About you'));view.append(element('h2','', 'How accurately does each statement describe you?'));view.append(element('p','muted','Think about how you generally are, rather than how you wish to be. Your progress is shown above.'));for(let i=p*10;i<p*10+10;i++){const wrap=element('div','question'),field=element('fieldset'),legend=element('legend');legend.append(element('span','number',String(i+1).padStart(2,'0')));legend.append(document.createTextNode(rows[i][0]));field.append(legend);const choices=element('div','choices');options.forEach((label,n)=>{const l=element('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=n+1;input.checked=answers[i]===n+1;input.addEventListener('change',()=>{answers[i]=n+1});l.append(input,document.createTextNode(label));choices.append(l)});field.append(choices);wrap.append(field);view.append(wrap)}const error=element('p','error');error.id='answer-error';error.setAttribute('role','alert');view.append(error);const actions=element('div','actions');if(p>0)actions.append(button('Back',()=>show(p-1),true));actions.append(button(p===4?'See my results':'Continue',()=>{const first=answers.findIndex((a,i)=>i>=p*10&&i<p*10+10&&a===null);if(first!==-1){error.textContent='Please respond to every statement on this screen.';document.querySelectorAll('.question')[first-p*10].querySelector('input').focus();return}p===4?results():show(p+1)}));view.append(actions);focusHeading()}
function results(){page=5;header('Your results',100);const totals=Array(5).fill(0);rows.forEach((r,i)=>{totals[r[1]]+=r[2]===1?answers[i]:6-answers[i]});view.append(element('div','eyebrow','Your five-trait profile'));view.append(element('h1','','A pattern, not a type'));view.append(element('p','','Each score adds 10 responses and can range from 10 to 50. Your result places your answers along that dimension. The bars show the possible score range, not percentiles or comparisons with other students.'));view.append(element('p','muted','The descriptions below explain both ends of each dimension. “Toward” and “center” refer only to the possible 10–50 range, not to population averages. These are possibilities for reflection, not conclusions about everything you do.'));names.forEach((name,i)=>{const section=element('section','result'),top=element('div','result-head');top.append(element('strong','',name),element('strong','',totals[i]+' / 50'));const track=element('div','track'),fill=element('div','fill');fill.style.width=((totals[i]-10)/40*100)+'%';track.append(fill);section.append(top,track,element('p','',descriptions[i][0]));const position=totals[i]<27?'Your answers fall toward the first end described below.':totals[i]>33?'Your answers fall toward the second end described below.':'Your answers fall around the center of the possible range.';section.append(element('p','muted',position));const ends=element('div','compare');ends.append(element('div','',descriptions[i][1]),element('div','',descriptions[i][2]));section.append(ends);view.append(section)});const box=element('div','callout');box.innerHTML='<h3>Before you leave: screenshot your results</h3><p>Take a screenshot that includes all five scores. You can use it for your Canvas reflection or submission. If the screen is too long on your phone, take two screenshots.</p><p><strong>Privacy:</strong> You choose whether to share the screenshot. Closing or refreshing this page clears your answers.</p>';view.append(box);view.insertAdjacentHTML('beforeend','<h2>How does this compare with personality “types”?</h2><div class="compare"><div><strong>Type-based approaches</strong><p>Frameworks such as Myers–Briggs describe preferences using categories or letter combinations.</p></div><div><strong>This Big Five activity</strong><p>Shows five continuous scores. People can fall anywhere along each dimension, rather than being assigned one type.</p></div></div><p class="muted">This activity is not the Myers–Briggs Type Indicator (MBTI®), and its scores cannot be converted into an MBTI type. It is for classroom discussion, not diagnosis or high-stakes decisions.</p><h3>Reflect in Canvas</h3><ol><li>Which trait score surprised you, if any?</li><li>How might your answers change across situations or over time?</li><li>What is gained or lost when personality is described with dimensions instead of types?</li></ol><p><small>Source: <a href="https://ipip.ori.org/new_ipip-50-item-scale.htm">50-item IPIP representation of Goldberg’s (1992) Big Five factor markers</a>. Scoring uses the IPIP positive and reverse keys. No population norms are applied.</small></p>');const actions=element('div','actions');actions.append(button('Review last ten statements',()=>show(4),true),button('Start over',()=>{answers.fill(null);intro()},true));view.append(actions);focusHeading()}
intro();
})();
</script></body></html>
